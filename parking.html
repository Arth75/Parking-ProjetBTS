<html>
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réservation Parking</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<style> 
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Arial, sans-serif;
}

body {
  background-color: #e8e6ff;
  color: #222;
}

.cv-container {
  display: flex;
  max-width: 900px;
  margin: 40px auto;
  background-color: #fff;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

.sidebar {
  width: 30%;
  background-color: #dcd8ff;
  padding: 25px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.photo img {
  width: 100%;
  border-radius: 5px;
  margin-bottom: 20px;
}

.sidebar section {
  width: 100%;
  margin-bottom: 30px;
}

.sidebar h3 {
  border-bottom: 2px solid #8b83ff;
  font-size: 15px;
  margin-bottom: 10px;
  color: #333;
}

.sidebar p, 
.sidebar li {
  font-size: 14px;
  margin-bottom: 8px;
}

.sidebar ul {
  list-style: none;
  padding-left: 0;
}

.sidebar i {
  color: #4b47ff;
  margin-right: 8px;
}

.main-content {
  width: 70%;
  padding: 40px;
  background: #fff;
}

header h1 {
  font-size: 30px;
  font-weight: 700;
  color: #262262;
  line-height: 1.2;
}

header h2 {
  font-size: 16px;
  font-weight: 500;
  color: #8b83ff;
  margin-top: 8px;
}

.about {
  margin: 20px 0;
  font-size: 15px;
  line-height: 1.6;
}

.main-content h3 {
  font-size: 16px;
  color: #262262;
  margin-top: 25px;
  border-bottom: 2px solid #8b83ff;
  display: inline-block;
  padding-bottom: 3px;
}

.exp-item {
  margin: 15px 0;
}

.exp-item h4 {
  font-size: 15px;
  font-weight: 600;
}

.exp-item .date {
  float: right;
  color: #777;
  font-size: 14px;
}

.exp-item p {
  font-size: 14px;
  margin: 4px 0;
  color: #444;
}

.expertise ul {
  margin-top: 10px;
  padding-left: 18px;
}

.expertise li {
  font-size: 14px;
  margin-bottom: 6px;
}

@media (max-width: 768px) {
  .cv-container {
    flex-direction: column;
  }

  .sidebar, .main-content {
    width: 100%;
  }

  .main-content {
    padding: 25px;
  }

  header h1 {
    font-size: 24px;
  }
}
</style>
</body>
  

  
</head>
</html>
